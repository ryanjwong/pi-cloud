# Template for secrets.yaml. Create the real file encrypted, never in plaintext:
#   cp secrets.example.yaml secrets.yaml && sops encrypt --in-place secrets.yaml
#   sops secrets.yaml        # edit later
# Keys are setting names (see `pi-cloud-config`); leave out what you do not use.

# Runner: model providers
ANTHROPIC_API_KEY: sk-ant-...
OPENAI_API_KEY: sk-...

# Runner: secrets sandbox templates may request, listed by name in SANDBOX_SECRETS. With a GitHub App (below),
# leave GITHUB_TOKEN out: sessions get the App's tokens instead.
SANDBOX_SECRETS: GITHUB_TOKEN
GITHUB_TOKEN: ghp_...

# Runner: Daytona sandboxes (templates with provider "daytona")
DAYTONA_API_KEY: dtn_...

# Control plane backups (read by Litestream, not pi-cloud; see litestream.example.yml)
# LITESTREAM_ACCESS_KEY_ID: ...
# LITESTREAM_SECRET_ACCESS_KEY: ...

# Control plane: encrypts stored credentials (`pi-cloud login` subscriptions, API keys); any long random string
PI_CLOUD_CREDENTIAL_KEY: change-me

# Control plane <-> runners (split deployments, Cloudflare)
PI_CLOUD_RUNNER_SECRET: change-me

# Control plane: clients (comma-separated); required unless the server listens on 127.0.0.1
PI_CLOUD_API_KEYS: change-me

# Control plane: a GitHub App. Sessions about a repository get hour-long installation tokens for it as GITHUB_TOKEN;
# the key never leaves the control plane. The App's webhook secret is GITHUB_WEBHOOK_SECRET.
GITHUB_APP_ID: "123456"
GITHUB_APP_PRIVATE_KEY: |
  -----BEGIN RSA PRIVATE KEY-----
  ...
  -----END RSA PRIVATE KEY-----

# Control plane: connectors
GITHUB_WEBHOOK_SECRET: change-me
SLACK_SIGNING_SECRET: change-me
SLACK_BOT_TOKEN: xoxb-...
