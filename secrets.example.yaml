# Template for secrets.yaml. Create the real file encrypted, never in plaintext:
#   cp secrets.example.yaml secrets.yaml && sops encrypt --in-place secrets.yaml
#   sops secrets.yaml        # edit later
# Keys are setting names (see `pi-cloud-config`); leave out what you do not use.

# Runner: model providers
ANTHROPIC_API_KEY: sk-ant-...
OPENAI_API_KEY: sk-...

# Runner: secrets sandbox templates may request, listed by name in SANDBOX_SECRETS
SANDBOX_SECRETS: GITHUB_TOKEN
GITHUB_TOKEN: ghp_...

# Control plane <-> runners (split deployments, Cloudflare)
PI_CLOUD_RUNNER_SECRET: change-me

# Control plane: clients (comma-separated); omit to accept every client on a private network
PI_CLOUD_API_KEYS: change-me

# Control plane: connectors
GITHUB_WEBHOOK_SECRET: change-me
SLACK_SIGNING_SECRET: change-me
SLACK_BOT_TOKEN: xoxb-...
